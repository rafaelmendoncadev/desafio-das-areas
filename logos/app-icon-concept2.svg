<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338CA"/>
      <stop offset="50%" style="stop-color:#6D28D9"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#b1)"/>

  <!-- Hexagon -->
  <polygon points="256,40 440,148 440,364 256,472 72,364 72,148" fill="none" stroke="white" stroke-width="3" opacity="0.2"/>
  <polygon points="256,80 400,168 400,344 256,432 112,344 112,168" fill="none" stroke="white" stroke-width="2" opacity="0.15"/>

  <!-- Inner hexagon filled -->
  <polygon points="256,100 380,178 380,334 256,412 132,334 132,178" fill="white" opacity="0.12"/>

  <!-- Conversion arrow -->
  <path d="M170,256 L230,220 L230,240 L340,240 L340,272 L230,272 L230,292 Z" fill="white" opacity="0.95"/>

  <!-- Unit labels -->
  <text x="145" y="330" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="white" opacity="0.7">km²</text>
  <text x="320" y="330" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="white" opacity="0.7">m²</text>

  <!-- Bottom text -->
  <text x="256" y="480" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="white" opacity="0.6">ÁREAS</text>
</svg>