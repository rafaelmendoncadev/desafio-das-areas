<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#F8FAFC" filter="url(#sh)"/>

  <!-- Stacked squares -->
  <rect x="25" y="25" width="85" height="85" rx="14" fill="url(#g3)" opacity="0.6"/>
  <rect x="40" y="40" width="80" height="80" rx="14" fill="url(#g2)" opacity="0.8"/>
  <rect x="55" y="55" width="75" height="75" rx="14" fill="url(#g1)"/>

  <!-- Grid -->
  <line x1="80" y1="55" x2="80" y2="130" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="105" y1="55" x2="105" y2="130" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="55" y1="80" x2="130" y2="80" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <line x1="55" y1="105" x2="130" y2="105" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Highlighted cells -->
  <rect x="57" y="57" width="22" height="22" rx="3" fill="white" opacity="0.95"/>
  <rect x="81" y="57" width="22" height="22" rx="3" fill="white" opacity="0.65"/>
  <rect x="57" y="81" width="22" height="22" rx="3" fill="white" opacity="0.65"/>
  <rect x="81" y="81" width="22" height="22" rx="3" fill="white" opacity="0.4"/>

  <!-- m² symbol -->
  <text x="100" y="155" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#4F46E5">m²</text>
</svg>