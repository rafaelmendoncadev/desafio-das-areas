<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon: Stacked area squares with measurement grid -->
  <g id="icon" transform="translate(10, 10)" filter="url(#shadow1)">
    <!-- Back square (largest) -->
    <rect x="5" y="5" width="55" height="55" rx="8" fill="url(#grad3)" opacity="0.7"/>
    <!-- Middle square -->
    <rect x="15" y="15" width="50" height="50" rx="8" fill="url(#grad2)" opacity="0.85"/>
    <!-- Front square (smallest) -->
    <rect x="25" y="25" width="45" height="45" rx="8" fill="url(#grad1)"/>

    <!-- Grid lines inside front square -->
    <line x1="40" y1="25" x2="40" y2="70" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="55" y1="25" x2="55" y2="70" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="40" x2="70" y2="40" stroke="white" stroke-width="1" opacity="0.4"/>
    <line x1="25" y1="55" x2="70" y2="55" stroke="white" stroke-width="1" opacity="0.4"/>

    <!-- Small squares highlighting area -->
    <rect x="27" y="27" width="12" height="12" rx="2" fill="white" opacity="0.9"/>
    <rect x="41" y="27" width="12" height="12" rx="2" fill="white" opacity="0.6"/>
    <rect x="27" y="41" width="12" height="12" rx="2" fill="white" opacity="0.6"/>
    <rect x="41" y="41" width="12" height="12" rx="2" fill="white" opacity="0.35"/>

    <!-- m² label -->
    <text x="52" y="82" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#4F46E5">m²</text>
  </g>

  <!-- Text -->
  <g id="text">
    <text x="100" y="52" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#1F2937">
      Desafio das
    </text>
    <text x="100" y="90" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="url(#grad1)">
      Áreas
    </text>
    <text x="290" y="90" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#6B7280">
      Conversão de unidades
    </text>
  </g>
</svg>