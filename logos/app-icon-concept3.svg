<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="d1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338CA"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="d2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#d1)"/>

  <!-- Ruler at bottom -->
  <rect x="40" y="380" width="432" height="40" rx="8" fill="white" opacity="0.2"/>
  <!-- Ruler ticks -->
  <line x1="80" y1="380" x2="80" y2="400" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="140" y1="380" x2="140" y2="400" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="200" y1="380" x2="200" y2="400" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="260" y1="380" x2="260" y2="400" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="320" y1="380" x2="320" y2="400" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="380" y1="380" x2="380" y2="400" stroke="white" stroke-width="3" opacity="0.6"/>
  <line x1="440" y1="380" x2="440" y2="400" stroke="white" stroke-width="3" opacity="0.6"/>

  <!-- Small ticks -->
  <line x1="110" y1="380" x2="110" y2="392" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="170" y1="380" x2="170" y2="392" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="230" y1="380" x2="230" y2="392" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="290" y1="380" x2="290" y2="392" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="350" y1="380" x2="350" y2="392" stroke="white" stroke-width="2" opacity="0.4"/>
  <line x1="410" y1="380" x2="410" y2="392" stroke="white" stroke-width="2" opacity="0.4"/>

  <!-- Area block -->
  <rect x="100" y="70" width="312" height="300" rx="24" fill="white" opacity="0.15"/>
  <rect x="120" y="90" width="272" height="260" rx="20" fill="white" opacity="0.12"/>

  <!-- Grid -->
  <line x1="210" y1="90" x2="210" y2="350" stroke="white" stroke-width="2" opacity="0.25"/>
  <line x1="310" y1="90" x2="310" y2="350" stroke="white" stroke-width="2" opacity="0.25"/>
  <line x1="120" y1="180" x2="392" y2="180" stroke="white" stroke-width="2" opacity="0.25"/>
  <line x1="120" y1="270" x2="392" y2="270" stroke="white" stroke-width="2" opacity="0.25"/>

  <!-- Highlighted cells -->
  <rect x="124" y="94" width="83" height="83" rx="10" fill="white" opacity="0.9"/>
  <rect x="214" y="94" width="93" height="83" rx="10" fill="white" opacity="0.6"/>
  <rect x="124" y="184" width="83" height="83" rx="10" fill="white" opacity="0.6"/>
  <rect x="214" y="184" width="93" height="83" rx="10" fill="white" opacity="0.38"/>

  <!-- Dimension arrow vertical -->
  <line x1="410" y1="90" x2="410" y2="350" stroke="white" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <polygon points="410,82 404,96 416,96" fill="white" opacity="0.7"/>
  <polygon points="410,358 404,344 416,344" fill="white" opacity="0.7"/>

  <!-- m² text -->
  <text x="256" y="465" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="900" fill="white" opacity="0.9">m²</text>
</svg>