<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="c2g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="50%" style="stop-color:#6D28D9"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="c2g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
    <filter id="c2sh" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6D28D9" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Icon: Hexagonal badge with area symbols -->
  <g id="icon" transform="translate(5, 5)" filter="url(#c2sh)">
    <!-- Hexagon background -->
    <polygon points="55,5 100,28 100,72 55,95 10,72 10,28" fill="url(#c2g1)"/>

    <!-- Inner hexagon -->
    <polygon points="55,18 85,35 85,65 55,82 25,65 25,35" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>

    <!-- Conversion arrows -->
    <path d="M35,50 L50,40 L50,47 L70,47 L70,53 L50,53 L50,60 Z" fill="white" opacity="0.95"/>

    <!-- Area units text -->
    <text x="55" y="75" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="white" opacity="0.8">km²→m²</text>
  </g>

  <!-- Text -->
  <g id="text">
    <text x="115" y="42" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#1F2937">DESAFIO</text>
    <text x="115" y="78" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#c2g1)">DAS ÁREAS</text>
    <rect x="115" y="88" width="180" height="2" rx="1" fill="url(#c2g2)"/>
    <text x="115" y="105" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9CA3AF" letter-spacing="2">CONVERSÃO DE UNIDADES</text>
  </g>
</svg>