<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="a1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="a2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="a3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#a1)"/>

  <!-- Subtle pattern -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#a1)"/>

  <!-- Back square -->
  <rect x="60" y="60" width="300" height="300" rx="40" fill="white" opacity="0.12"/>

  <!-- Middle square -->
  <rect x="100" y="100" width="280" height="280" rx="36" fill="white" opacity="0.18"/>

  <!-- Front square -->
  <rect x="140" y="140" width="260" height="260" rx="32" fill="white" opacity="0.25"/>

  <!-- Grid lines -->
  <line x1="220" y1="140" x2="220" y2="400" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="310" y1="140" x2="310" y2="400" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="140" y1="225" x2="400" y2="225" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="140" y1="315" x2="400" y2="315" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- Highlighted cells -->
  <rect x="148" y="148" width="68" height="73" rx="8" fill="white" opacity="0.9"/>
  <rect x="224" y="148" width="82" height="73" rx="8" fill="white" opacity="0.6"/>
  <rect x="148" y="229" width="68" height="82" rx="8" fill="white" opacity="0.6"/>
  <rect x="224" y="229" width="82" height="82" rx="8" fill="white" opacity="0.38"/>

  <!-- m² text -->
  <text x="256" y="470" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="900" fill="white">m²</text>
</svg>